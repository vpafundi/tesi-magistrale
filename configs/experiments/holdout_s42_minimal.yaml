experiment_id: holdout_s42_minimal
extends: ../base.yaml

meta:
  description: >
    Split canonico holdout sul sample legacy; classiche + SLM multi-modello (confronto famiglia s42).
  sagemaker_instance_type: ml.g5.2xlarge

paths:
  output_root: ${TESI_OUTPUT_DIR}

dataset:
  path: data/df_sample_all.parquet

split:
  strategy: holdout
  seed: 42
  test_frac: 0.07
  val_frac: 0.05

prompt:
  version: minimal

sequence:
  max_seq_len_mode: manual
  max_seq_len: 15360

runs:
  slm:
    - model: Qwen/Qwen3-1.7B
      modes: [constrained, free]
    - model: HuggingFaceTB/SmolLM3-3B
      modes: [constrained, free]
    - model: google/gemma-3-4b-it
      modes: [constrained, free]

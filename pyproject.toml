[project]
name = "tesi-magistrale"
version = "0.1.0"
description = "SLM baseline and fine-tuning for insurance document segment classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[dependency-groups]
preprocess = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "httpx>=0.27",
]
eval = [
    "transformers>=4.56",
    "jinja2>=3.1",
    "huggingface-hub>=0.34",
    "matplotlib>=3.8",
]
train = [
    "huggingface-hub>=0.34",
]
eda = [
    "sentence-transformers>=3.0",
    "cleanlab>=2.5",
    "umap-learn>=0.5",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_baseline"]

[tool.uv]
default-groups = ["preprocess", "eval", "eda"]
